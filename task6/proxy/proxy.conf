resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_servers {
    zone api_servers 64k;
    server back-end:5252 resolve;
}

server {
    listen 80;
    server_name localhost;

    location /api {
        proxy_pass http://api_servers;
    }

    location / {
        proxy_pass http://front-end:9000;
    }
}
